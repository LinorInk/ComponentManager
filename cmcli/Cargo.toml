[package]
name = "cmcli"
version = "0.1.1"
description = "元件库存管理器 命令行工具 —— 与图形界面共用同一 SQLite 数据库"
edition = "2021"

[[bin]]
name = "cmcli"
path = "src/main.rs"

[dependencies]
cm-core = { path = "../core" }
serde = "1"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
codegen-units = 1
lto = true
strip = true
